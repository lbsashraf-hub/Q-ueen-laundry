<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Queen Laundry</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #f472b6 0%, #db2777 100%);
            --accent-glow: rgba(219, 39, 119, 0.15);
            --bg-body: #fff5f8;
            --card-bg: #ffffff;
            --text-main: #3f3f46;
            --text-muted: #71717a;
            --border-color: #fbcfe8;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-soft: 0 12px 35px -10px rgba(219, 39, 119, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 16px 60px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-box h1 {
            font-size: 1.15rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 12px;
            color: #db2777;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            background: var(--bg-body);
            color: var(--text-main);
            outline: none;
        }

        .form-input:focus {
            border-color: #db2777;
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .btn-submit {
            display: block;
            background: var(--primary-gradient);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 25px rgba(219, 39, 119, 0.25);
            margin-top: 10px;
        }

        .hidden { display: none !important; }

        .member-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin-top: 12px;
        }

        .member-table th, .member-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .member-table th {
            font-weight: 800;
            color: #db2777;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-logout {
            background: #71717a;
            color: white;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HALAMAN LOGIN ADMIN -->
        <div class="card" id="loginCard">
            <div class="header-box">
                <h1>🔐 Login Admin</h1>
                <a href="index.html" class="back-btn">← Beranda</a>
            </div>
            <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px;">
                Masukkan kredensial admin untuk mengelola data member Queen Laundry.
            </p>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="usernameInput" class="form-input" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="passwordInput" class="form-input" placeholder="Masukkan password">
            </div>
            <button type="button" class="btn-submit" onclick="prosesLogin()">Masuk ke Panel</button>
        </div>

        <!-- PANEL KELOLA MEMBER (Tersembunyi Sebelum Login) -->
        <div class="card hidden" id="panelCard">
            <div class="header-box">
                <h1>👑 Panel Admin Queen</h1>
                <a href="index.html" class="back-btn">← Lihat Web</a>
            </div>

            <h3 style="font-size: 0.95rem; font-weight: 800; margin-bottom: 12px; color: var(--text-main);">➕ Tambah / Perbarui Member</h3>
            <div class="form-group">
                <label>Nama Member:</label>
                <input type="text" id="namaMember" class="form-input" placeholder="Contoh: Ibu Siska">
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp:</label>
                <input type="text" id="waMember" class="form-input" placeholder="Contoh: 085770246502">
            </div>
            <div class="form-group">
                <label>Sisa Kuota:</label>
                <input type="text" id="kuotaMember" class="form-input" placeholder="Contoh: 14.5 Kg">
            </div>
            <div class="form-group">
                <label>Masa Aktif:</label>
                <input type="text" id="aktifMember" class="form-input" placeholder="Contoh: Aktif hingga: 12 Okt 2026">
            </div>
            <button type="button" class="btn-submit" onclick="simpanMember()">💾 Simpan Data Member</button>

            <hr style="border: none; border-top: 1px dashed var(--border-color); margin: 20px 0;">

            <h3 style="font-size: 0.95rem; font-weight: 800; margin-bottom: 8px; color: var(--text-main);">📋 Daftar Member Tersimpan</h3>
            <div style="overflow-x: auto;">
                <table class="member-table">
                    <thead>
                        <tr>
                            <th>Nama & No. HP</th>
                            <th>Sisa Kuota</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelMemberBody">
                        <!-- Data dimuat dinamis lewat JS -->
                    </tbody>
                </table>
            </div>

            <button type="button" class="btn-submit btn-logout" onclick="prosesLogout()">🚪 Keluar (Logout Admin)</button>
        </div>
    </div>

    <script>
        // ATUR USERNAME & PASSWORD ADMIN ANDA DI SINI
        const ADMIN_USER = "adminqueen";
        const ADMIN_PASS = "laundry123";

        window.onload = function() {
            if (localStorage.getItem('queen_admin_session') === 'active') {
                tampilkanPanel();
            }
        }

        function prosesLogin() {
            let u = document.getElementById('usernameInput').value.trim();
            let p = document.getElementById('passwordInput').value.trim();

            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem('queen_admin_session', 'active');
                tampilkanPanel();
            } else {
                alert("Username atau Password salah!");
            }
        }

        function tampilkanPanel() {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('panelCard').classList.remove('hidden');
            muatTabelMember();
        }

        function prosesLogout() {
            localStorage.removeItem('queen_admin_session');
            document.getElementById('panelCard').classList.add('hidden');
            document.getElementById('loginCard').classList.remove('hidden');
            document.getElementById('usernameInput').value = '';
            document.getElementById('passwordInput').value = '';
        }

        function simpanMember() {
            let nama = document.getElementById('namaMember').value.trim();
            let wa = document.getElementById('waMember').value.trim();
            let kuota = document.getElementById('kuotaMember').value.trim();
            let aktif = document.getElementById('aktifMember').value.trim();

            if (!nama || !kuota || !wa) {
                alert("Harap isi nama, nomor WhatsApp, dan sisa kuota dengan lengkap!");
                return;
            }

            // Simpan berdasarkan nomor HP sebagai kunci unik
            let db = JSON.parse(localStorage.getItem('queen_member_db')) || {};
            db[wa] = { nama, wa, sisa: kuota, aktif };
            
            localStorage.setItem('queen_member_db', JSON.stringify(db));
            alert("Data member berhasil disimpan! ✨");

            // Reset input
            document.getElementById('namaMember').value = '';
            document.getElementById('waMember').value = '';
            document.getElementById('kuotaMember').value = '';
            document.getElementById('aktifMember').value = '';

            muatTabelMember();
        }

        function muatTabelMember() {
            let db = JSON.parse(localStorage.getItem('queen_member_db')) || {};
            let tbody = document.getElementById('tabelMemberBody');
            tbody.innerHTML = '';

            let keys = Object.keys(db);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Belum ada data member.</td></tr>`;
                return;
            }

            keys.forEach(waKey => {
                let m = db[waKey];
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${m.nama}</b><br><span style="font-size: 0.72rem; color: var(--text-muted);">${m.wa}</span></td>
                    <td><span style="color: #db2777; font-weight: 700;">${m.sisa}</span></td>
                    <td><button class="btn-delete" onclick="hapusMember('${waKey}')">Hapus</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function hapusMember(waKey) {
            if (confirm("Yakin ingin menghapus data member ini?")) {
                let db = JSON.parse(localStorage.getItem('queen_member_db')) || {};
                delete db[waKey];
                localStorage.setItem('queen_member_db', JSON.stringify(db));
                muatTabelMember();
            }
        }
    </script>
</body>
</html>
