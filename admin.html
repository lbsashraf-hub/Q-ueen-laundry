    <script>
        const PASSWORD_ADMIN = "admin123"; 
        const API_URL = "https://panel.ryhar.my.id"; // URL Backend Pterodactyl Anda

        function cekAuth() {
            let isAuth = sessionStorage.getItem('queen_admin_auth');
            if (isAuth === 'true') {
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('adminMainContent').style.display = 'block';
                muatDataMember();
            } else {
                document.getElementById('loginModal').classList.add('active');
                document.getElementById('inputPasswordAdmin').focus();
            }
        }

        function prosesLogin() {
            let val = document.getElementById('inputPasswordAdmin').value;
            let errorMsg = document.getElementById('loginErrorMsg');

            if (val === PASSWORD_ADMIN) {
                sessionStorage.setItem('queen_admin_auth', 'true');
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('adminMainContent').style.display = 'block';
                muatDataMember();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('inputPasswordAdmin').value = '';
                document.getElementById('inputPasswordAdmin').focus();
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('queen_admin_auth');
            window.location.reload();
        }

        window.onload = function() {
            cekAuth();
            let tglDefault = new Date();
            tglDefault.setMonth(tglDefault.getMonth() + 1);
            document.getElementById('adminExpired').value = tglDefault.toISOString().split('T')[0];
        };

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        // AMBIL DATA LANGSUNG DARI SERVER BOT
        async function muatDataMember() {
            let container = document.getElementById('listMemberAdmin');
            container.innerHTML = `<p style="font-size: 0.82rem; color: var(--text-muted);">Memuat data dari server...</p>`;

            try {
                let response = await fetch(`${API_URL}/api/member`);
                if (!response.ok) throw new Error("Gagal mengambil data dari server");
                
                let result = await response.json();
                
                // Ubah format objek dari bot (jika bentuknya key-value) menjadi array
                let data = [];
                if (Array.isArray(result)) {
                    data = result;
                } else if (typeof result === 'object' && result !== null) {
                    data = Object.values(result);
                }

                if (data.length === 0) {
                    container.innerHTML = `<p style="font-size: 0.82rem; color: var(--text-muted);">Belum ada data member tersimpan.</p>`;
                    return;
                }

                container.innerHTML = "";
                data.forEach((m, index) => {
                    let item = document.createElement('div');
                    item.className = 'member-item';
                    item.innerHTML = `
                        <div class="member-info">
                            <h4>${m.nama}</h4>
                            <p>Exp: ${m.expired || m.expiredDate || '-'}</p>
                            <p>Sisa Saldo: <b>${formatRupiah(m.saldo)}</b></p>
                        </div>
                        <div class="action-buttons">
                            <button class="btn-action btn-add" title="Tambah Saldo" onclick="ubahSaldo('${m.nama}', 'tambah')">➕</button>
                            <button class="btn-action btn-minus" title="Potong Saldo" onclick="ubahSaldo('${m.nama}', 'kurang')">➖</button>
                            <button class="btn-action btn-delete" title="Hapus Member" onclick="hapusMember('${m.nama}')">🗑️</button>
                        </div>
                    `;
                    container.appendChild(item);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<p style="font-size: 0.82rem; color: #ef4444;">Gagal terhubung ke server bot.</p>`;
            }
        }

        async function simpanMember() {
            let nama = document.getElementById('adminNama').value.trim();
            let saldo = parseFloat(document.getElementById('adminSaldo').value) || 0;
            let expiredDate = document.getElementById('adminExpired').value;

            if (!nama) {
                alert("Harap isi Nama Pelanggan terlebih dahulu!");
                return;
            }

            try {
                let response = await fetch(`${API_URL}/api/tambah-member`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        nama: nama, 
                        saldo: saldo, 
                        expiredDate: expiredDate 
                    })
                });
                
                if (response.ok) {
                    document.getElementById('adminNama').value = "";
                    document.getElementById('adminSaldo').value = "50000";
                    muatDataMember();
                    alert("Member baru berhasil ditambahkan!");
                } else {
                    alert("Gagal menyimpan member ke server.");
                }
            } catch (error) {
                console.error('Koneksi ke server bot gagal:', error);
                alert("Terjadi kesalahan koneksi ke server.");
            }
        }

        async function ubahSaldo(namaMember, tipe) {
            let pesan = tipe === 'tambah' 
                ? `Masukkan jumlah nominal saldo yang ingin DITAMBAHKAN untuk ${namaMember}:` 
                : `Masukkan jumlah nominal saldo yang ingin DIPOTONG dari ${namaMember}:`;

            let nominalInput = prompt(pesan, "10000");
            if (nominalInput === null) return;
            
            let nominal = parseFloat(nominalInput);
            if (isNaN(nominal) || nominal <= 0) {
                alert("Masukkan nominal angka yang valid!");
                return;
            }

            // Catatan: Pastikan nanti endpoint update saldo di bot Anda sudah siap jika ingin tombol ➕/➖ berfungsi online.
            alert("Fitur update saldo via web sedang disinkronkan.");
            muatDataMember();
        }

        async function hapusMember(namaMember) {
            if (confirm(`Yakin ingin menghapus ${namaMember} dari daftar?`)) {
                // Tambahkan fungsi hapus ke backend bot jika diperlukan
                alert("Fitur hapus member sedang disinkronkan.");
                muatDataMember();
            }
        }
    </script>
